name: Run E2E Tests

# E2E drives the full extension against a *connected* KeepKey device, which
# GitHub's headless runners don't have — so it can never pass in CI. Keep it
# manual-only: run it from the Actions tab on a machine with a device attached.
on:
  workflow_dispatch:

jobs:
  chrome:
    name: E2E tests for Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm e2e

  firefox:
    name: E2E tests for Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm e2e:firefox
